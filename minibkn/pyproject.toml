[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "minibkn"
version = "0.6.0"
description = "A Python-first, local reproduction of the BKN Foundry core workflow"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=2.0,<3",
  "numpy>=2.0,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
semantic = [
  "sentence-transformers>=5.1,<6",
]
evaluation = [
  "ragas==0.4.3",
  # Ragas 0.4.3 imports the legacy VertexAI module removed in
  # langchain-community 0.4. Pin the last compatible release line.
  "langchain-community>=0.3.31,<0.4",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
minibkn = "minibkn.main:run"
minibkn-mcp = "minibkn.mcp_server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/minibkn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
